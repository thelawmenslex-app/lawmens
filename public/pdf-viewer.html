<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>THE-LAWMEN'S PDF Viewer</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #1e293b;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #pdf-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px;
      gap: 15px;
    }
    canvas {
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3), 0 4px 6px -4px rgba(0, 0, 0, 0.3);
      max-width: 100%;
      height: auto !important;
      border-radius: 6px;
      background-color: #ffffff;
    }
    #loading {
      color: #94a3b8;
      font-size: 14px;
      font-weight: 600;
      text-align: center;
      margin-top: 40px;
    }
  </style>
</head>
<body>
  <div id="loading">Loading schedule document...</div>
  <div id="pdf-container"></div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const fileUrl = urlParams.get('file');

    if (fileUrl) {
      // Set worker source
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

      const container = document.getElementById('pdf-container');
      const loadingEl = document.getElementById('loading');

      // Load document
      pdfjsLib.getDocument(fileUrl).promise.then(pdf => {
        loadingEl.style.display = 'none';

        // Render pages sequentially
        let renderPage = (pageNum) => {
          if (pageNum > pdf.numPages) return;

          pdf.getPage(pageNum).then(page => {
            // Adjust scale for high-quality display
            const viewport = page.getViewport({ scale: 2.0 });
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            
            canvas.height = viewport.height;
            canvas.width = viewport.width;
            container.appendChild(canvas);

            page.render({
              canvasContext: context,
              viewport: viewport
            }).promise.then(() => {
              // Load next page
              renderPage(pageNum + 1);
            });
          });
        };

        // Start rendering from page 1
        renderPage(1);
      }).catch(err => {
        loadingEl.innerText = 'Failed to load document: ' + err.message;
        console.error('PDFJS error:', err);
      });
    } else {
      document.getElementById('loading').innerText = 'No PDF file specified.';
    }
  </script>
</body>
</html>
