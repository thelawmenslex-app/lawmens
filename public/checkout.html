<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>THE-LAWMEN'S | Official Subscription Checkout</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>
</head>
<body class="bg-[#181A20] text-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-[#20242D] border border-slate-700/60 rounded-3xl p-6 shadow-2xl space-y-5">
    <!-- Header -->
    <div class="text-center">
      <div class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-[#25AAE2]/15 text-[#25AAE2] mb-2">
        <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2L1 21h22L12 2zm0 3.5L19.5 19H4.5L12 5.5z"/></svg>
      </div>
      <h1 class="text-2xl font-black text-white tracking-wider">THE-LAWMEN'S</h1>
      <p class="text-xs text-[#25AAE2] font-bold uppercase tracking-widest mt-1">Official Legal Subscription</p>
    </div>

    <!-- Selected Plan Card -->
    <div class="space-y-1.5">
      <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider">Selected Plan</label>
      <div class="p-4 bg-[#181A20] border border-[#25AAE2]/40 rounded-2xl flex items-center justify-between">
        <div>
          <h3 id="planTitle" class="font-bold text-base text-white">Start up Plan</h3>
          <p id="planDesc" class="text-xs text-slate-400 mt-0.5">Full Legal Database & Bare Acts Access</p>
        </div>
        <span id="planPrice" class="text-2xl font-black text-[#25AAE2]">₹1500</span>
      </div>
    </div>

    <!-- Live User Profile Form -->
    <div class="space-y-3">
      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1">Subscriber Name</label>
        <input id="userName" type="text" class="w-full px-3.5 py-2.5 bg-[#181A20] border border-slate-700 rounded-xl text-sm text-white focus:outline-none focus:border-[#25AAE2] font-medium">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1">Email Address</label>
        <input id="userEmail" type="email" class="w-full px-3.5 py-2.5 bg-[#181A20] border border-slate-700 rounded-xl text-sm text-white focus:outline-none focus:border-[#25AAE2] font-medium">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1">Mobile Number (WhatsApp)</label>
        <input id="userPhone" type="tel" class="w-full px-3.5 py-2.5 bg-[#181A20] border border-slate-700 rounded-xl text-sm text-white focus:outline-none focus:border-[#25AAE2] font-medium">
      </div>
    </div>

    <!-- Status Box -->
    <div id="statusBox" class="hidden p-3.5 rounded-xl text-xs font-semibold"></div>

    <!-- Checkout Button -->
    <button id="payBtn" onclick="activateSubscription()" class="w-full py-3.5 px-6 rounded-2xl font-black text-white bg-[#25AAE2] hover:bg-[#1E90C0] transition flex items-center justify-center gap-2 shadow-lg shadow-sky-500/25 active:scale-98">
      <span id="payBtnText">Confirm & Activate Premium Pass →</span>
    </button>

    <div class="text-center text-[11px] text-slate-400 flex items-center justify-center gap-1.5 pt-1">
      <svg class="w-4 h-4 text-[#25AAE2]" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 1.944A11.954 11.954 0 012.166 5C2.056 5.649 2 6.319 2 7c0 5.225 3.34 9.67 8 11.317C14.66 16.67 18 12.225 18 7c0-.682-.057-1.35-.166-2.001A11.954 11.954 0 0110 1.944zM11 14a1 1 0 11-2 0 1 1 0 012 0zm0-7a1 1 0 10-2 0v3a1 1 0 102 0V7z" clip-rule="evenodd"></path></svg>
      <span>256-bit SSL Encrypted • Official THE-LAWMEN'S Pass</span>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    
    // Amount extraction
    let numPrice = Number(urlParams.get('price')) || Number(urlParams.get('amount')) || 1500;
    if (numPrice > 50000) {
      numPrice = numPrice / 100;
    }
    const rupeeAmount = Math.round(numPrice);

    const planName = decodeURIComponent(urlParams.get('plan') || urlParams.get('planName') || 'Start up');
    const validityDays = Number(urlParams.get('validity')) || 30;
    const name = decodeURIComponent(urlParams.get('name') || 'Advocate');
    const email = decodeURIComponent(urlParams.get('email') || 'advocate@thelawmens.com');
    const phone = decodeURIComponent(urlParams.get('phone') || '9876543210');
    const userId = urlParams.get('userId') || '';

    // Populate Elements
    document.getElementById('planTitle').innerText = planName;
    document.getElementById('planPrice').innerText = '₹' + rupeeAmount;
    document.getElementById('userName').value = name;
    document.getElementById('userEmail').value = email;
    document.getElementById('userPhone').value = phone;
    document.getElementById('payBtnText').innerText = 'Confirm & Activate ₹' + rupeeAmount + ' Pass →';

    async function activateSubscription() {
      const currentName = document.getElementById('userName').value || name;
      const currentEmail = document.getElementById('userEmail').value || email;
      const currentPhone = document.getElementById('userPhone').value || phone;

      const statusBox = document.getElementById('statusBox');
      statusBox.className = 'p-4 bg-sky-500/15 border border-sky-500/40 text-sky-300 rounded-2xl text-xs space-y-1 block';
      statusBox.innerHTML = '<strong>Processing...</strong><br>Activating your subscription on THE-LAWMEN\'S...';

      try {
        const verifyRes = await fetch('/api/v1/payments/activate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            paymentId: 'WEB_ACT_' + Date.now(),
            orderId: 'ORD_' + Date.now(),
            baseAmount: rupeeAmount,
            planName: planName,
            validityDays: validityDays,
            email: currentEmail,
            userId: userId
          })
        });
        const vData = await verifyRes.json();
        statusBox.className = 'p-4 bg-emerald-500/15 border border-emerald-500/40 text-emerald-300 rounded-2xl text-xs space-y-1 block';
        statusBox.innerHTML = '<strong class="text-emerald-400 text-sm">🎉 Subscription Activated!</strong><br><span class="text-slate-200">Your account is now upgraded to Premium. Please return to the mobile app and tap "Check Status".</span>';
      } catch (e) {
        statusBox.className = 'p-3.5 bg-rose-500/15 border border-rose-500/40 text-rose-300 rounded-xl text-xs block';
        statusBox.innerText = 'Could not activate subscription. Please check connection and try again.';
      }
    }
  </script>
</body>
</html>
